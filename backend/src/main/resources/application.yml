spring:
  application:
    name: leave-approval-system
  datasource:
    # H2 chay thang trong bo nho, khoi phai cai dat gi de chay Stage 2/3.
    # DB_CLOSE_DELAY=-1 giu DB song suot vong doi app, khong thi dong connection cuoi
    # la mat sach du lieu. Van reset moi lan restart - du demo, chua phai luu tru that.
    url: jdbc:h2:mem:leavedb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: none # schema.sql/data.sql tu quan ly bang - khong de Hibernate tu doan schema
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

# Secret doc tu bien moi truong JWT_SECRET luc deploy. Gia tri mac dinh duoi day chi de
# chay local, dung mang len server.
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-please-change-me-0123456789abcdef}
    expiration-ms: 28800000 # 8 tieng - 1 ca lam viec

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
