spring:
  application:
    name: leave-approval-system
  datasource:
    # H2 in-memory: du du chay Stage 2/3 khong can cai dat gi them. DB_CLOSE_DELAY=-1
    # giu DB song suot vong doi app (khong mat du lieu giua cac connection), nhung
    # reset lai tu dau moi lan restart app - du de demo, chua phai luu tru that.
    url: jdbc:h2:mem:leavedb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: none # schema.sql/data.sql tu quan ly bang - khong de Hibernate tu doan schema
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

# app.jwt.secret doc tu bien moi truong JWT_SECRET khi deploy that (12-factor config) -
# gia tri mac dinh chi danh cho chay local/demo.
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-please-change-me-0123456789abcdef}
    expiration-ms: 28800000 # 8 tieng - 1 ca lam viec

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
