services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: leavedb
      POSTGRES_USER: ${DB_USER:-leaveapp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-leaveapp}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-leaveapp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: db
      DB_NAME: leavedb
      DB_USER: ${DB_USER:-leaveapp}
      DB_PASSWORD: ${DB_PASSWORD:-leaveapp}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-a-real-deployment-0123456789}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    # Container chay roi khong co nghia la app da san sang nhan request. JVM voi Spring
    # Boot mat vai chuc giay moi len, start_period cho no khoang tho do ma khong bi tinh
    # la that bai. wget dung luon duoc, BusyBox trong image alpine da co san.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    # Phai doi backend UP han. nginx resolve hostname "backend" ngay luc khoi dong, neu
    # luc do backend chua len thi moi request /api tra 502 cho den khi co ai reload lai.
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8081:80"

volumes:
  db-data:
