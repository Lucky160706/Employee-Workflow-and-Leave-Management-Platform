server {
    listen 80;

    # Serve React SPA - route khong khop file tinh nao thi tra ve index.html
    # de react-router tu xu ly (client-side routing).
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Proxy /api sang backend cung docker-compose network - tranh loi CORS ma
    # khong phai cau hinh CORS o Spring Boot chi de phuc vu setup nay.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
    }
}
