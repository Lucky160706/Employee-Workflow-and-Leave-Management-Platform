server {
    listen 80;

    # Duong dan nao khong khop file tinh nao thi tra ve index.html cho react-router
    # tu dinh tuyen. Thieu dong nay thi F5 giua chung se ra 404.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Day /api sang backend trong cung mang docker-compose. Trinh duyet chi thay mot
    # origin nen khong dinh CORS, khoi phai cau hinh CORS ben Spring chi vi viec nay.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
    }
}
